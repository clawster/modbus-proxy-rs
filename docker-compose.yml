services:
  modbus-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: modbus-proxy-rs:latest
    container_name: modbus-proxy
    restart: unless-stopped
    environment:
      RUST_LOG: info
    volumes:
      - ./modbus-proxy.yml:/etc/modbus-proxy.yml:ro
    ports:
      # Container runs as an unprivileged user: bind ports >1024 inside it
      - "5020:5020"

# Dependabot security updates only: open-pull-requests-limit 0 disables
# routine version-bump PRs, while security update PRs are still opened for
# vulnerable dependencies (needs "Dependabot alerts" and "Dependabot
# security updates" enabled in the repository settings).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

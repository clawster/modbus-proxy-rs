services:
  modbus-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: modbus-proxy-rs:latest
    container_name: modbus-proxy
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    configs:
      - source: modbus-proxy
        target: /etc/modbus-proxy.yml
    ports:
      # Container runs as an unprivileged user: listen on a port >1024
      - "${PROXY_PORT:?set PROXY_PORT in .env}:${PROXY_PORT}"

configs:
  modbus-proxy:
    content: |
      status_interval: ${STATUS_INTERVAL:-120}
      ip_filter:
        allow: [${IP_ALLOW:-}]
        deny: [${IP_DENY:-}]
      devices:
      - modbus:
          url: "${MODBUS_DEVICE:?set MODBUS_DEVICE in .env}"
          name: "${MODBUS_NAME:-${MODBUS_DEVICE}}"
          registers: "${REGISTER_MAP:-/etc/modbus-proxy/registers/sigenergy.json}"
        listen:
          bind: "0.0.0.0:${PROXY_PORT}"

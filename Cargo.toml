[package]
name = "modbus-proxy-rs"
version = "1.0.0"
edition = "2021"
authors = [ "Tiago Coutinho <coutinhotiago@gmail.com>",]
description = "Modbus TCP proxy"
homepage = "https://github.com/tiagocoutinho/modbus-proxy-rs"
repository = "https://github.com/tiagocoutinho/modbus-proxy-rs"
readme = "README.md"
rust-version = "1.99"
keywords = [ "modbus", "TCP", "proxy", "bridge" ]
categories = ["network-programming"]
license = "GPL-3.0-or-later"
publish = true

[badges]
maintenance = { status = "experimental" }

[dependencies]
tokio = { version = "1.53", features = ["rt", "net", "macros", "io-util", "sync", "time", "signal"] }
clap = { version = "4.6", features = ["derive"] }
log = "0.4.34"
env_logger = "0.11"
config = "0.15"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
futures = "0.3.34"

#[target.'cfg(all(target_env = "musl", target_pointer_width = "64"))'.dependencies.jemallocator]
#version = "0.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
